        - generic [ref=e172]: WHY PREBIOTICS
        - heading "Feed the bacteria. Everything else follows." [level=3] [ref=e173]
        - paragraph [ref=e174]: Probiotics add new bacteria. Prebiotics feed the ones already doing the work. We use acacia tree fibre because it's one of the most extensively studied, gut-tolerated prebiotics available. It survives digestion intact and delivers where it counts.
        - generic [ref=e175]:
          - generic [ref=e176]:
            - paragraph [ref=e177]: Digestion
            - paragraph [ref=e178]: Acacia fibre slows glucose absorption and smooths digestion, cutting bloating and irregular bowel patterns.
          - generic [ref=e179]:
            - paragraph [ref=e180]: Immunity
            - paragraph [ref=e181]: Over 70% of your immune cells live in the gut. A well-fed microbiome means a better-armed immune system.
          - generic [ref=e182]:
            - paragraph [ref=e183]: Energy
            - paragraph [ref=e184]: Short-chain fatty acids produced by prebiotic fermentation fuel your gut lining and support steady, caffeine-free energy.
          - generic [ref=e185]:
            - paragraph [ref=e186]: Mood
            - paragraph [ref=e187]: The gut-brain axis is real. Your microbiome produces neurotransmitters, and keeping it healthy directly affects how you feel.
