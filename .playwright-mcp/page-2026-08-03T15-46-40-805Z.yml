    - generic [ref=e75]:
      - generic [ref=e76]: OUR STORY
      - heading "Brewed with Patience, Served with Pride" [level=2] [ref=e77]
      - paragraph [ref=e78]: "GingerBros started with a simple question: why does everything sold as \"healthy\" taste like compromise? We wanted something that was genuinely good for you — not because it had vitamins added in a lab, but because the process itself created something nourishing. That search led us to fermentation."
      - paragraph [ref=e79]: "Every batch of our ginger fizz undergoes a full 7-day natural fermentation process. We keep the ingredient list short on purpose: fresh Thai ginger, water, cane sugar, and prebiotic acacia fibre. No concentrates, no artificial carbonation, no shortcuts. The slow ferment is where the magic happens — it's what gives each bottle its depth of flavour and its gentle, natural fizz."
      - paragraph [ref=e80]: "We source our acacia fibre specifically because it's one of the most well-studied prebiotic fibres in existence. Prebiotics aren't probiotics — they don't add new bacteria. Instead, they feed the good bacteria already living in your gut. When that ecosystem is well-fed, the effects ripple outward:"
      - list [ref=e81]:
        - listitem [ref=e82]: Better digestion and less bloating
        - listitem [ref=e84]: Stronger immunity — over 70% of immune cells live in the gut
        - listitem [ref=e86]: Steadier energy without caffeine spikes or crashes
        - listitem [ref=e88]: Improved mood — the gut and brain are in constant conversation
      - paragraph [ref=e90]: We're based in Bangkok, where ginger has been part of everyday cooking and traditional medicine for centuries. Our relationships with local growers mean we get fresh, fiery rhizomes harvested at peak potency — not the pallid, month-old stuff shipped across continents. That provenance matters. You can taste it.
      - paragraph [ref=e91]: GingerBros isn't trying to be the next mass-market soft drink. We're building something smaller, more intentional, and more honest — a drink that earns its place on your table because it actually does what it says. Brewed slow. Kept real. Enjoyed easy.
      - button "Learn Our Process" [ref=e92] [cursor=pointer]
    - generic [ref=e94]:
      - generic [ref=e95]:
        - generic [ref=e96]: THE PROCESS
        - heading "7 Days to Perfection" [level=2] [ref=e97]
      - generic [ref=e98]:
        - generic [ref=e99]:
          - generic [ref=e100]: "01"
          - generic [ref=e102]: Day 1-2
          - heading "Ginger & Sugar" [level=3] [ref=e103]
          - paragraph [ref=e104]: Fresh ginger is grated and combined with raw sugar and filtered water. The ginger bug (our live culture starter) is added to begin the fermentation.
        - generic [ref=e105]:
          - generic [ref=e106]: "02"
          - generic [ref=e108]: Day 3-5
          - heading "Natural Ferment" [level=3] [ref=e109]
          - paragraph [ref=e110]: Wild yeast and beneficial bacteria transform the sugars. Bubbles begin to form as CO2 develops naturally. The brew develops its signature bite.
        - generic [ref=e111]:
          - generic [ref=e112]: "03"
          - generic [ref=e114]: Day 6-7
          - heading "Condition & Bottle" [level=3] [ref=e115]
          - paragraph [ref=e116]: The ginger fizz is strained, conditioned for flavor development, then carefully bottled to capture natural carbonation.
        - generic [ref=e117]:
          - generic [ref=e118]: "04"
          - generic [ref=e120]: Ready
          - heading "Enjoy Cold" [level=3] [ref=e121]
          - paragraph [ref=e122]: Chill thoroughly before opening. Expect a bright, refreshing pop. Real ginger fizz, naturally fermented and ready to drink.
    - generic [ref=e124]:
      - generic [ref=e125]:
        - generic [ref=e126]: WHY GINGER FIZZ
        - heading "More Than a Drink" [level=2] [ref=e127]
        - paragraph [ref=e128]: For centuries ginger has been used to calm the stomach and fire up digestion. We brew it the old, slow way — with real ingredients and prebiotic acacia fibre — so it does you good and tastes like it means it.
      - generic [ref=e129]:
        - generic [ref=e130]:
          - heading "Prebiotic Power" [level=3] [ref=e134]
          - paragraph [ref=e135]: We add acacia tree fibre, one of the most well-researched prebiotic sources available, to actively feed your gut bacteria and keep your microbiome thriving.
        - generic [ref=e136]:
          - heading "Clean Ingredients" [level=3] [ref=e141]
          - paragraph [ref=e142]: "Core ingredients you can count on one hand: fresh ginger, water, sugar, and prebiotic acacia fibre. Non-GMO. No artificial additives, no preservatives, no shortcuts."
        - generic [ref=e143]:
          - heading "Steady Energy" [level=3] [ref=e147]
          - paragraph [ref=e148]: Prebiotics feed the good bacteria that help regulate energy metabolism over time. No caffeine, no spike, no crash. Just a steady, feel-good lift from the inside out.
        - generic [ref=e149]:
          - heading "Soothes & Settles" [level=3] [ref=e156]
          - paragraph [ref=e157]: Real ginger is a time-tested remedy for nausea, bloating, and sluggish digestion. Our fizz makes the daily dose something you actually look forward to.
